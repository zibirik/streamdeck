name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    name: Windows server (build + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build server/windows/StreamPanel.sln -c Release
      - run: dotnet test server/windows/StreamPanel.sln -c Release --no-build

  android:
    name: Android app (debug build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: UI smoke tests (renders every screen and saves screenshots)
        # Informational for now: the renderer is verified on Windows; make it blocking once it has run on CI a few times.
        continue-on-error: true
        working-directory: android
        run: gradle :feature:dashboard:testDebugUnitTest :feature:settings:testDebugUnitTest --stacktrace
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            android/feature/dashboard/build/screens/*.png
            android/feature/settings/build/screens/*.png
          if-no-files-found: ignore
          retention-days: 14
